<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA BIUD — Acesso Interno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #060B16;
      --surface:  rgba(255,255,255,0.04);
      --border:   rgba(255,255,255,0.08);
      --blue:     #3B82F6;
      --purple:   #8B5CF6;
      --cyan:     #22D3EE;
      --green:    #10B981;
      --red:      #EF4444;
      --text:     #F1F5F9;
      --muted:    #64748B;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ── Background ── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.035) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(120px); pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 600px; height: 600px; top: -200px; left: -150px;  background: rgba(59,130,246,0.12); }
    .orb-2 { width: 500px; height: 500px; bottom: -150px; right: -100px; background: rgba(139,92,246,0.10); }

    /* ── Layout ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
    }

    /* ── Card ── */
    .card {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.75rem 2.5rem 2.5rem;
      backdrop-filter: blur(24px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo ── */
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-text {
      font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-text span { -webkit-text-fill-color: var(--muted); font-weight: 600; }
    .logo-tag {
      margin-top: 0.4rem;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Heading ── */
    .heading { margin-bottom: 1.75rem; }
    .heading h1 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.3rem; }
    .heading p  { font-size: 0.82rem; color: var(--muted); }

    /* ── Form ── */
    .field { margin-bottom: 1.1rem; }
    label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: var(--muted); margin-bottom: 0.45rem; letter-spacing: 0.3px;
    }
    .input-wrap { position: relative; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      color: var(--text); font-size: 0.9rem; font-family: inherit;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    input::placeholder { color: var(--muted); }

    /* eye toggle */
    .eye-btn {
      position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--muted);
      font-size: 1rem; padding: 0.2rem; line-height: 1;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--text); }

    /* ── Submit ── */
    .btn {
      width: 100%; margin-top: 1.5rem;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      border: none; border-radius: 0.65rem;
      color: #fff; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.15s;
      position: relative; overflow: hidden;
    }
    .btn:hover  { opacity: 0.92; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Error ── */
    .error-msg {
      display: none;
      margin-top: 1rem;
      padding: 0.65rem 0.9rem;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 0.5rem;
      font-size: 0.8rem; color: #fca5a5;
      animation: shake 0.3s ease;
    }
    .error-msg.visible { display: flex; align-items: center; gap: 0.5rem; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    /* ── Footer note ── */
    .note {
      margin-top: 2rem; text-align: center;
      font-size: 0.72rem; color: var(--muted);
    }
    .note strong { color: rgba(255,255,255,0.3); font-weight: 500; }

    /* ── Loading spinner no botão ── */
    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn.loading .btn-label { display: none; }
    .btn.loading .spinner   { display: block; }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="page">
    <div class="card">

      <div class="logo">
        <div class="logo-text">BIUD <span>/ QA</span></div>
        <div class="logo-tag">// Portal Interno — Acesso Restrito</div>
      </div>

      <div class="heading">
        <h1>Entrar no portal</h1>
        <p>Acesso exclusivo para o time de Quality Assurance da BIUD.</p>
      </div>

      <form id="loginForm" autocomplete="off" onsubmit="handleLogin(event)">

        <div class="field">
          <label for="user">Usuário</label>
          <div class="input-wrap">
            <input type="text" id="user" placeholder="Digite seu usuário" autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label for="pass">Senha</label>
          <div class="input-wrap">
            <input type="password" id="pass" placeholder="Digite sua senha" autocomplete="current-password" />
            <button type="button" class="eye-btn" onclick="togglePass()" title="Mostrar/ocultar senha">👁</button>
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">
          <span class="btn-label">Entrar</span>
          <div class="spinner"></div>
        </button>

        <div class="error-msg" id="errorMsg">
          <span>🔒</span>
          <span>Usuário ou senha incorretos. Tente novamente.</span>
        </div>

      </form>

      <p class="note">
        Acesso restrito ao time interno da BIUD.<br/>
        <strong>BIUD V3 – ESG SEBRAE · Sprint 39</strong>
      </p>

    </div>
  </div>

  <script>
    // Já está logado? Redirecionar direto.
    if (sessionStorage.getItem('qa_auth') === '1') {
      window.location.replace('index.html');
    }

    function handleLogin(e) {
      e.preventDefault();
      var user = document.getElementById('user').value.trim();
      var pass = document.getElementById('pass').value;
      var btn  = document.getElementById('submitBtn');
      var err  = document.getElementById('errorMsg');

      err.classList.remove('visible');
      btn.classList.add('loading');
      btn.disabled = true;

      // Simula pequena latência para UX
      setTimeout(function() {
        if (user === 'admin' && pass === 'admin') {
          sessionStorage.setItem('qa_auth', '1');
          window.location.replace('index.html');
        } else {
          btn.classList.remove('loading');
          btn.disabled = false;
          err.classList.add('visible');
          document.getElementById('pass').value = '';
          document.getElementById('pass').focus();
        }
      }, 600);
    }

    function togglePass() {
      var inp = document.getElementById('pass');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    // Enter funciona nos dois campos
    document.getElementById('user').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('pass').focus();
    });
  </script>

</body>
</html>
